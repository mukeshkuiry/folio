<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <radialGradient id="orb1-1" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2-1" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FAF7F3" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg-1)" />
  <rect width="800" height="600" fill="url(#orb1-1)" />
  <rect width="800" height="600" fill="url(#orb2-1)" />
  <rect width="800" height="600" fill="url(#grid-1)" />

