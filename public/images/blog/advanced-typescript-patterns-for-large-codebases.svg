    <circle cx="130" cy="130" r="72" fill="none" stroke="#FAF7F3" stroke-opacity="0.2" stroke-width="1.2" />
    <rect x="82" y="82" width="96" height="96" rx="18" fill="#111111" fill-opacity="0.7" stroke="#10B981" stroke-width="1.5" transform="rotate(15 130 130)" />
    <circle cx="130" cy="130" r="8" fill="#10B981" />
  </g>

  <rect x="44" y="44" width="210" height="36" rx="8" fill="#FAF7F3" fill-opacity="0.1" stroke="#FAF7F3" stroke-opacity="0.2" />
  <text x="62" y="67" fill="#10B981" font-family="monospace" font-weight="700" font-size="13" letter-spacing="2">TYPESCRIPT</text>

  <text x="44" y="140" fill="#FAF7F3" fill-opacity="0.16" font-family="sans-serif" font-weight="800" font-size="72">02</text>
