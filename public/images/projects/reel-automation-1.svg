<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" width="1160" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180D1E" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#180D1E" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FAF7F3" stroke-width="1" stroke-opacity="0.05" />
    </pattern>
  </defs>
  <rect width="1160" height="800" fill="url(#bg)" />
  <rect width="1160" height="800" fill="url(#glow)" />
  <rect width="1160" height="800" fill="url(#grid)" />
  
  <!-- Top Window Frame -->
  <rect x="70" y="64" width="1020" height="672" rx="20" fill="#111111" fill-opacity="0.82" stroke="#FAF7F3" stroke-opacity="0.14" stroke-width="1.5" />
  <line x1="70" y1="120" x2="1090" y2="120" stroke="#FAF7F3" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="104" cy="92" r="7" fill="#EB4D6D" />
  <circle cx="126" cy="92" r="7" fill="#F59E0B" />
  <circle cx="148" cy="92" r="7" fill="#10B981" />
  <text x="180" y="97" fill="#FAF7F3" fill-opacity="0.5" font-family="monospace" font-size="13" letter-spacing="2">GOLANG · FFMPEG · YT-DLP · CRON · GRAPH API</text>

  <!-- Title & Architecture Header -->
  <text x="116" y="210" fill="#F43F5E" font-family="sans-serif" font-weight="700" font-size="15" letter-spacing="4">PRODUCTION SYSTEM // MUKESH KUIRY</text>
  <text x="116" y="278" fill="#FAF7F3" font-family="sans-serif" font-weight="800" font-size="58" letter-spacing="-1.5">REEL AUTOMATION</text>
  <text x="116" y="322" fill="#FAF7F3" fill-opacity="0.7" font-family="sans-serif" font-weight="400" font-size="24">Autonomous Reddit-to-Reels Media Pipeline</text>

  <!-- Code / Telemetry Terminal Box -->
  <rect x="116" y="366" width="928" height="176" rx="14" fill="#07090E" stroke="#F43F5E" stroke-opacity="0.35" stroke-width="1.2" />
  <text x="148" y="414" fill="#F43F5E" font-family="monospace" font-size="18">$ cron: "0 */2 * * *" -> FetchSubreddits()</text>
  <text x="148" y="458" fill="#FAF7F3" fill-opacity="0.85" font-family="monospace" font-size="18">&gt; score = velocity * 0.7 + comments * 0.3</text>
  <text x="148" y="502" fill="#A855F7" font-family="monospace" font-size="18">✓ ffmpeg -vf scale=1080:1920 -> IG Publish</text>

  <!-- Bottom Metrics Row -->
  <g transform="translate(116, 574)">
    <rect x="0" y="0" width="292" height="114" rx="12" fill="#FAF7F3" fill-opacity="0.05" stroke="#FAF7F3" stroke-opacity="0.1" />
    <text x="24" y="42" fill="#FAF7F3" fill-opacity="0.5" font-family="sans-serif" font-size="14" letter-spacing="1">SCHEDULE</text>
    <text x="24" y="84" fill="#FAF7F3" font-family="sans-serif" font-weight="700" font-size="28">Every 2 Hours</text>

    <rect x="318" y="0" width="292" height="114" rx="12" fill="#FAF7F3" fill-opacity="0.05" stroke="#FAF7F3" stroke-opacity="0.1" />
    <text x="342" y="42" fill="#FAF7F3" fill-opacity="0.5" font-family="sans-serif" font-size="14" letter-spacing="1">TRANSCODE</text>
    <text x="342" y="84" fill="#F43F5E" font-family="sans-serif" font-weight="700" font-size="28">FFmpeg 9:16</text>

    <rect x="636" y="0" width="292" height="114" rx="12" fill="#FAF7F3" fill-opacity="0.05" stroke="#FAF7F3" stroke-opacity="0.1" />
    <text x="660" y="42" fill="#FAF7F3" fill-opacity="0.5" font-family="sans-serif" font-size="14" letter-spacing="1">DEDUPLICATION</text>
    <text x="660" y="84" fill="#FAF7F3" font-family="sans-serif" font-weight="700" font-size="28">PostgreSQL Hash</text>
  </g>
</svg>